<!doctype html><html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>F Moja</title><link rel="stylesheet" href="style.css"></head><body><header><h1>F Moja</h1><small>Faktury i KPiR</small></header><nav><button onclick="show('home')">Pulpit</button><button onclick="show('invoice')">Faktura</button><button onclick="show('cost')">Koszt</button><button onclick="show('kpir')">KPiR</button></nav><main><section id="home"><h2>Twoja firma</h2><p>Prosta aplikacja do faktur i księgowania. Dane są zapisywane na tym urządzeniu.</p><div class="cards"><b id="invCount">Faktury: 0</b><b id="costCount">Koszty: 0</b></div></section><section id="invoice" hidden><h2>Nowa faktura</h2><input id="buyer" placeholder="Kontrahent"><input id="number" placeholder="Numer faktury"><input id="item" placeholder="Towar / usługa"><input id="gross" type="number" step="0.01" placeholder="Kwota brutto"><button onclick="saveInvoice()">Zapisz fakturę</button><button onclick="window.print()">Drukuj / PDF</button><div id="invoiceList"></div></section><section id="cost" hidden><h2>Nowy koszt</h2><input id="supplier" placeholder="Dostawca"><input id="doc" placeholder="Numer dokumentu"><input id="desc" placeholder="Opis kosztu"><input id="costGross" type="number" step="0.01" placeholder="Kwota brutto"><button onclick="saveCost()">Zaksięguj koszt</button></section><section id="kpir" hidden><h2>KPiR</h2><button onclick="exportCsv()">Eksport CSV</button><div class="table"><table><thead><tr><th>Lp.</th><th>Data</th><th>Dokument</th><th>Kontrahent</th><th>Opis</th><th>Przychód</th><th>Wydatek</th></tr></thead><tbody id="kpirRows"></tbody></table></div></section></main><script src="app.js"></script></body></html>
